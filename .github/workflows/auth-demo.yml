name: Auth demo

# The auth path (NUT-21 / NUT-22) has no live coverage in the integration
# suite: every auth test mocks fetch. This runs the password-grant demo
# against a real Keycloak and a real mint so a regression fails the PR that
# caused it.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-demo:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - run: npm ci

      - name: Run the password-grant demo
        working-directory: examples/auth_mint
        run: make demo-ci

      - name: Container logs on failure
        if: ${{ failure() }}
        working-directory: examples/auth_mint
        run: docker compose logs --tail 200 || true
