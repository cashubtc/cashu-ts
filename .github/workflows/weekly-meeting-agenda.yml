name: Weekly meeting agenda

# Opens the Cashu-TS Development Meeting agenda issue, grouped by
# contributor. Tag issues/PRs `meeting-discussion` during the week to put
# them on the agenda; `drift` and `mutation-testing` issues appear under
# Standing Reports automatically.
on:
  schedule:
    - cron: '23 0 * * 3' # Wednesdays 00:23 UTC; GitHub delays crons here by up to ~7.5h, still lands before the 11:00 UTC meeting
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  agenda:
    if: github.repository == 'cashubtc/cashu-ts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'

      - name: Generate agenda and open issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/generate-agenda.mjs > agenda.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Cashu-TS Development Meeting — $(date -u +%Y-%m-%d)" \
            --label meeting-agenda \
            --body-file agenda.md
