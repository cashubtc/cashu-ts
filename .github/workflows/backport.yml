name: Backport merged pull request
on:
  pull_request_target:
    # Run on merge (close) or if a backport label is added after merging
    types: [closed, labeled]

# Single backport workflow per PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backport:
    name: Backport pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    # Skip closed-unmerged PRs and non-backport label events.
    # Label format: "backport <branch>", e.g. "backport v4-dev"
    if: |
      github.repository == 'cashubtc/cashu-ts' &&
      github.event.pull_request.merged &&
      (
        github.event.action != 'labeled' ||
        startsWith(github.event.label.name, 'backport')
      )

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: create-pr
        name: Create backport pull requests
        uses: korthout/backport-action@0ebd44f9c79a4a0a171200dcdcceec3ed9ca732f # v4.7.1
        with:
          # PAT so backport PRs trigger CI (default GITHUB_TOKEN PRs don't)
          github_token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # On conflict, push the branch with the conflict committed and open
          # a DRAFT PR (finish it in place: resolve, regenerate the api report,
          # push). The action comments resolution steps on the original PR.
          # In backport-action v4 this option lives under `experimental`; passed
          # top-level it is silently ignored and the action falls back to
          # fail-on-conflict (no draft PR pushed, as happened on #806/#807).
          experimental: |
            {
              "conflict_resolution": "draft_commit_conflicts"
            }
          # Ignore merge commits from "update branch" syncs
          merge_commits: skip
          # Backport marker goes at the END of the title: the default
          # "[Backport vN-dev]" PREFIX breaks release-please's conventional-
          # commit parsing after squash-merge (no release PR, no changelog
          # entry — bit us on #743). A suffix keeps the subject parseable.
          pull_title: '${pull_title} [backport ${target_branch}]'
