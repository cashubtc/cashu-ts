services:
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:25.0.0
    command: start-dev --import-realm --hostname keycloak.localtest.me
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - '8080:8080'
    volumes:
      - ./cashu-realm.json:/opt/keycloak/data/import/cashu-realm.json:ro
    networks:
      authnet:
        aliases:
          - keycloak.localtest.me

  mint:
    image: cashubtc/mintd:0.18.0
    platform: linux/amd64
    container_name: cdk_auth_mint
    depends_on:
      - keycloak
    environment:
      # Resolved at runtime from the `env:` ref in mintd.toml
      - CDK_MINTD_MNEMONIC=abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about
    volumes:
      - ./mintd.toml:/tmp/mintd.toml:ro
    # `config init` demands --new-mint on a fresh database; the retry covers a
    # container restarted onto one that already holds a mint.
    command:
      - sh
      - -c
      - cdk-mintd config init --file /tmp/mintd.toml --new-mint || cdk-mintd config init --file /tmp/mintd.toml --existing-mint; exec cdk-mintd
    ports:
      - '3338:3338'
    networks:
      - authnet

networks:
  authnet:
    driver: bridge
