# Unit and integration coverage upload separately: report once both are in.
codecov:
  notify:
    after_n_builds: 2

comment:
  after_n_builds: 2

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

ignore:
  - 'coverage/**'
  - 'docs-src/**'
  - 'examples/**'
  - 'scripts/**'
  - 'test/**'
  - 'commitlint.config.cjs'
  - '*.config.*'
